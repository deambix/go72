name: GO 72 quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: go72-quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  storefront:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          git ls-files "*.js" "*.cjs" | while IFS= read -r file; do node --check "$file" || exit 1; done
      - name: Generate patched dependency lockfile in cloud
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: CMS contract and API checks
        run: npm run test:cms
      - name: Audit source and build
        run: node scripts/audit.cjs
      - name: Install cloud-only browser checks
        run: npm install --no-save --package-lock=false @playwright/test@1.65.1 axe-core@4.14.1
      - name: Install Chromium
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "GO72_BROWSER_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium --only-shell
          fi
      - name: Verify storefront
        run: npm run check
      - name: Upload quality report and screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: go72-quality
          path: quality/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Vercel-ready build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: go72-dist
          path: dist/
          retention-days: 14
